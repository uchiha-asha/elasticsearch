setup:
  - do:
      index:
        index: test
        id:    testing_document
        body:
          body: Amsterdam meetup
  - do:
      indices.refresh: {}

---
"Basic tests for suggest API":

  - do:
      search:
        rest_total_hits_as_int: true
        body:
          suggest:
            test_suggestion:
              text: "The Amsterdma meetpu"
              term:
                field: body

  - match: {suggest.test_suggestion.1.options.0.text: amsterdam}
  - match: {suggest.test_suggestion.2.options.0.text: meetup}

---
"Term suggestion from URL parameters without suggest_mode":
  - requires:
      capabilities:
        - method: GET
          path: /_search
          capabilities: [ suggest_url_params_default_mode ]
      test_runner_features: capabilities
      reason: "suggest_mode defaults to missing when suggest_field is set"

  - do:
      search:
        index: test
        suggest_field: body
        suggest_text: "Amsterdma"

  - match: {suggest.body.0.options.0.text: amsterdam}
